<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Scholar Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding-top: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #667eea;
        }

        .search-button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .search-button:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
            padding: 20px;
            display: none;
        }

        .results {
            display: none;
        }

        .paper {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .paper:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .paper-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .paper-title a {
            color: #667eea;
            text-decoration: none;
        }

        .paper-title a:hover {
            text-decoration: underline;
        }

        .paper-authors {
            color: #666;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .paper-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            font-size: 0.9em;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #888;
        }

        .paper-abstract {
            color: #555;
            line-height: 1.6;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .no-results {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: #666;
            display: none;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 12px;
            padding: 20px;
            color: #c33;
            display: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Semantic Scholar</h1>
            <p>Search millions of academic papers</p>
        </div>

        <div class="search-box">
            <form class="search-form" id="searchForm">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Search for papers, authors, topics..."
                    required
                >
                <button type="submit" class="search-button">Search</button>
            </form>
        </div>

        <div class="loading" id="loading">🔍 Searching...</div>
        <div class="error" id="error"></div>
        <div class="no-results" id="noResults">No papers found. Try a different search term.</div>
        <div class="results" id="results"></div>
    </div>

    <script>
        const API_KEY = 'XVxzepJwOZ1lEgvUNLN7Ya3e5wabkmTG4BbTDheX';
        const form = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const noResults = document.getElementById('noResults');
        const errorDiv = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;

            // Reset UI
            loading.style.display = 'block';
            results.style.display = 'none';
            results.innerHTML = '';
            noResults.style.display = 'none';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch(`https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(query)}&limit=20&fields=title,authors,year,citationCount,abstract,url,publicationDate`, {
                    headers: {
                        'x-api-key': API_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                loading.style.display = 'none';

                if (data.data && data.data.length > 0) {
                    displayResults(data.data);
                } else {
                    noResults.style.display = 'block';
                }
            } catch (error) {
                loading.style.display = 'none';
                errorDiv.textContent = `Error: ${error.message}. Please try again.`;
                errorDiv.style.display = 'block';
                console.error('Search error:', error);
            }
        });

        function displayResults(papers) {
            results.style.display = 'block';
            
            papers.forEach(paper => {
                const paperDiv = document.createElement('div');
                paperDiv.className = 'paper';

                const authors = paper.authors 
                    ? paper.authors.map(a => a.name).join(', ')
                    : 'Unknown authors';

                const year = paper.year || 'N/A';
                const citations = paper.citationCount !== undefined ? paper.citationCount : 0;
                const abstract = paper.abstract 
                    ? paper.abstract.substring(0, 300) + (paper.abstract.length > 300 ? '...' : '')
                    : 'No abstract available.';

                paperDiv.innerHTML = `
                    <div class="paper-title">
                        ${paper.url 
                            ? `<a href="${paper.url}" target="_blank">${paper.title}</a>`
                            : paper.title
                        }
                    </div>
                    <div class="paper-authors">${authors}</div>
                    <div class="paper-meta">
                        <div class="meta-item">📅 ${year}</div>
                        <div class="meta-item">📖 ${citations} citations</div>
                    </div>
                    <div class="paper-abstract">${abstract}</div>
                `;

                results.appendChild(paperDiv);
            });
        }
    </script>
</body>
</html>
