<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bioRxiv/medRxiv Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        input, select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-btn {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 20px;
        }

        .results {
            display: grid;
            gap: 20px;
        }

        .paper-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .paper-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .paper-title {
            font-size: 1.4em;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .paper-authors {
            color: #555;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .paper-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .meta-item {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 20px;
            color: #666;
        }

        .paper-abstract {
            color: #444;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .paper-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border: 2px solid #667eea;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .paper-link:hover {
            background: #667eea;
            color: white;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .page-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .page-btn:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .search-controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 bioRxiv/medRxiv Search</h1>
            <p>Search preprint servers for the latest research</p>
        </div>

        <div class="search-box">
            <div class="search-controls">
                <div class="form-group">
                    <label for="server">Server</label>
                    <select id="server">
                        <option value="biorxiv">bioRxiv</option>
                        <option value="medrxiv">medRxiv</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="days">Recent Papers</label>
                    <select id="days">
                        <option value="7d">Last 7 days</option>
                        <option value="14d">Last 14 days</option>
                        <option value="30d">Last 30 days</option>
                        <option value="100">Last 100 papers</option>
                        <option value="custom">Custom date range</option>
                    </select>
                </div>

                <div class="form-group" id="startDateGroup" style="display:none;">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate">
                </div>

                <div class="form-group" id="endDateGroup" style="display:none;">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate">
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="keyword">🔍 Filter by Keyword (optional)</label>
                    <input type="text" id="keyword" placeholder="Search titles, authors, or abstracts...">
                </div>

                <button class="search-btn" id="searchBtn">Search Papers</button>
            </div>
        </div>

        <div id="loading" class="loading" style="display:none;">
            Loading papers...
        </div>

        <div id="error" class="error" style="display:none;"></div>

        <div id="results" class="results"></div>

        <div id="pagination" class="pagination" style="display:none;">
            <button class="page-btn" id="prevBtn">← Previous</button>
            <span style="color:white; padding:10px; font-weight:600;" id="pageInfo"></span>
            <button class="page-btn" id="nextBtn">Next →</button>
        </div>
    </div>

    <script>
        let currentCursor = 0;
        let totalCount = 0;
        let currentServer = 'biorxiv';
        let currentInterval = '7d';
        let currentStartDate = '';
        let currentEndDate = '';
        let allPapers = [];
        let filteredPapers = [];

        const daysSelect = document.getElementById('days');
        const startDateGroup = document.getElementById('startDateGroup');
        const endDateGroup = document.getElementById('endDateGroup');
        const keywordInput = document.getElementById('keyword');

        daysSelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                startDateGroup.style.display = 'block';
                endDateGroup.style.display = 'block';
            } else {
                startDateGroup.style.display = 'none';
                endDateGroup.style.display = 'none';
            }
        });

        keywordInput.addEventListener('input', () => {
            filterPapers();
        });

        document.getElementById('searchBtn').addEventListener('click', () => {
            currentCursor = 0;
            searchPapers();
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentCursor >= 100) {
                currentCursor -= 100;
                searchPapers();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentCursor + 100 < totalCount) {
                currentCursor += 100;
                searchPapers();
            }
        });

        async function searchPapers() {
            const server = document.getElementById('server').value;
            const days = document.getElementById('days').value;
            
            currentServer = server;

            let interval;
            if (days === 'custom') {
                const startDate = document.getElementById('startDate').value;
                const endDate = document.getElementById('endDate').value;
                if (!startDate || !endDate) {
                    showError('Please select both start and end dates');
                    return;
                }
                interval = `${startDate}/${endDate}`;
                currentStartDate = startDate;
                currentEndDate = endDate;
            } else {
                interval = days;
            }
            
            currentInterval = interval;

            const url = `https://api.medrxiv.org/details/${server}/${interval}/${currentCursor}/json`;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';
            document.getElementById('error').style.display = 'none';
            document.getElementById('pagination').style.display = 'none';

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.messages && data.messages.length > 0) {
                    totalCount = data.messages[0].total || 0;
                }

                allPapers = data.collection || [];
                filterPapers();
                updatePagination();
            } catch (error) {
                showError('Error fetching papers: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function filterPapers() {
            const keyword = document.getElementById('keyword').value.toLowerCase().trim();
            
            if (!keyword) {
                filteredPapers = allPapers;
            } else {
                filteredPapers = allPapers.filter(paper => {
                    const title = (paper.title || '').toLowerCase();
                    const authors = (paper.authors || '').toLowerCase();
                    const abstract = (paper.abstract || '').toLowerCase();
                    
                    return title.includes(keyword) || 
                           authors.includes(keyword) || 
                           abstract.includes(keyword);
                });
            }
            
            displayResults(filteredPapers);
            
            // Update pagination info for filtered results
            const pagination = document.getElementById('pagination');
            if (filteredPapers.length > 0) {
                pagination.style.display = 'none'; // Hide pagination for filtered results
            }
        }

        function displayResults(papers) {
            const resultsDiv = document.getElementById('results');
            
            if (papers.length === 0) {
                resultsDiv.innerHTML = '<div class="paper-card"><p>No papers found for this search.</p></div>';
                return;
            }

            papers.forEach(paper => {
                const card = document.createElement('div');
                card.className = 'paper-card';

                const authorsText = paper.authors ? paper.authors.split(';').slice(0, 5).join(', ') + (paper.authors.split(';').length > 5 ? ', et al.' : '') : 'No authors listed';

                const abstract = paper.abstract ? 
                    (paper.abstract.length > 400 ? paper.abstract.substring(0, 400) + '...' : paper.abstract) : 
                    'No abstract available';

                card.innerHTML = `
                    <h3 class="paper-title">${paper.title || 'Untitled'}</h3>
                    <div class="paper-authors">${authorsText}</div>
                    <div class="paper-meta">
                        <span class="meta-item">📅 ${paper.date || 'No date'}</span>
                        <span class="meta-item">🏷️ ${paper.category || 'Uncategorized'}</span>
                        <span class="meta-item">📊 v${paper.version || '1'}</span>
                        ${paper.published ? '<span class="meta-item">✅ Published</span>' : ''}
                    </div>
                    <div class="paper-abstract">${abstract}</div>
                    <a href="https://doi.org/${paper.doi}" target="_blank" class="paper-link">View Paper →</a>
                `;

                resultsDiv.appendChild(card);
            });
        }

        function updatePagination() {
            const pagination = document.getElementById('pagination');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');

            if (totalCount > 100) {
                pagination.style.display = 'flex';
                prevBtn.disabled = currentCursor === 0;
                nextBtn.disabled = currentCursor + 100 >= totalCount;
                
                const start = currentCursor + 1;
                const end = Math.min(currentCursor + 100, totalCount);
                pageInfo.textContent = `${start}-${end} of ${totalCount}`;
            } else {
                pagination.style.display = 'none';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Load initial results
        searchPapers();
    </script>
</body>
</html>
