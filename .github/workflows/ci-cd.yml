name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Run linting (if applicable)
      run: npm run lint || echo "No lint script found"

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --only=production

    - name: Run build (if applicable)
      run: npm run build || echo "No build script found"

    - name: Build Docker image
      run: |
        docker build -t body-peptide-map:${{ github.sha }} .
        docker tag body-peptide-map:${{ github.sha }} body-peptide-map:latest

    - name: Run security scan
      run: |
        # Run any security checks here
        npm audit --audit-level moderate || echo "Audit issues found"

    - name: Deploy to production (example)
      run: |
        # Add your deployment commands here
        # This is just an example - replace with your actual deployment method
        echo "Deploying to production environment..."
        # docker run -d -p 3000:3000 body-peptide-map:${{ github.sha }}