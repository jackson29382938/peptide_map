name: Mirror to GitLab
on: [push, delete]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          # Replace the URL below with your GitLab repo URL
          # Format: gitlab.com
          target_repo_url: https://your-gitlab-username:${{ secrets.GITLAB_TOKEN }}@gitlab.com
