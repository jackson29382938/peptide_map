<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Region Highlighter</title>

    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-gray-800">

    <div id="info-box">
        <p class="font-bold text-lg mb-1" id="info-title">Model Ready</p>
        <p class="text-gray-300 whitespace-pre-line" id="info-message">Click on any muscle region to see a highlight!</p>
    </div>

    <div id="container" class="w-screen h-screen"></div>

    <!-- Three.js core + helpers -->
    <script src="js/three-deps.js"></script>

    <!-- Application modules (order matters) -->
    <script src="js/regions.js"></script>
    <script src="js/init.js"></script>
    <script src="js/model.js"></script>
    <script src="js/interaction.js"></script>
    <script src="js/utils.js"></script>

    <!-- Bootstrap -->
    <script>
        window.addEventListener('load', () => {
            initScene();
            animate();
            window.addEventListener('resize', onWindowResize);
            document.getElementById('container').addEventListener('click', onMouseClick);
        });
    </script>
</body>
</html>
